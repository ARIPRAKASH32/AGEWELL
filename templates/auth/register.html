{% extends 'base.html' %}

{% block title %}Create Account - Senior Independence Portal{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      
      <div class="card-3d p-4 p-md-5 bg-white">
        <div class="text-center mb-4">
          <div class="d-inline-flex p-3 rounded-circle bg-success bg-opacity-10 text-success mb-2">
            <i class="bi bi-person-plus-fill fs-1"></i>
          </div>
          <h2 class="font-serif fw-bold text-forest-900">Create an Account</h2>
          <p class="text-secondary small">Join the AGEWELL Care Network</p>
        </div>

        <form action="{{ url_for('register') }}" method="POST">
          <div class="mb-3">
            <label class="form-label fw-bold text-secondary small">Full Name</label>
            <input type="text" name="name" class="form-control form-control-lg bg-light border-0" placeholder="e.g. Eleanor Vance" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold text-secondary small">Email Address</label>
            <input type="email" name="email" class="form-control form-control-lg bg-light border-0" placeholder="name@domain.com" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold text-secondary small">Phone Number (for SMS Alerts)</label>
            <input type="tel" name="phone" class="form-control form-control-lg bg-light border-0" placeholder="+1 (210) 555-0101">
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold text-secondary small">Select Your Role</label>
            <select name="role" class="form-select form-select-lg bg-light border-0">
              <option value="senior" selected>Senior Citizen (Independent Living)</option>
              <option value="family">Family Member / Primary Caregiver</option>
              <option value="doctor">Medical Doctor / Healthcare Professional</option>
              <option value="admin">System Administrator</option>
            </select>
            <div class="form-text small text-muted">
              Note: Family and Doctor roles require Senior approval before access is granted.
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-bold text-secondary small">Password</label>
            <input type="password" name="password" class="form-control form-control-lg bg-light border-0" placeholder="Create a secure password" required>
          </div>

          <button type="submit" class="btn-3d btn-3d-lime w-100 py-3 fs-5 mb-3">
            Create Account <i class="bi bi-arrow-right"></i>
          </button>

          <div class="text-center small text-secondary">
            Already have an account? 
            <a href="{{ url_for('login') }}" class="fw-bold text-success text-decoration-none">Sign In</a>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>
{% endblock %}
