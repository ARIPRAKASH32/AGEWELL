{% extends 'base.html' %}

{% block title %}Sign In - Senior Independence Portal{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      
      <!-- 3D Login Card -->
      <div class="card-3d p-4 p-md-5 bg-white">
        <div class="text-center mb-4">
          <div class="d-inline-flex p-3 rounded-circle bg-success bg-opacity-10 text-success mb-2">
            <i class="bi bi-shield-lock-fill fs-1"></i>
          </div>
          <h2 class="font-serif fw-bold text-forest-900">Welcome Back</h2>
          <p class="text-secondary small">Access your personalized Senior Independence dashboard</p>
        </div>

        <!-- Fast Demo Credentials Pill Switcher -->
        <div class="p-3 rounded-4 mb-4" style="background: var(--cream-200); border: 1px dashed rgba(20, 62, 49, 0.2);">
          <div class="small fw-bold text-forest-900 mb-2 text-center">
            <i class="bi bi-lightning-charge-fill text-warning"></i> Instant Demo Logins (Click to autofill):
          </div>
          <div class="d-flex flex-wrap gap-2 justify-content-center">
            <button type="button" class="btn btn-sm btn-outline-success rounded-pill fw-bold" onclick="fillDemoLogin('senior')">
              <i class="bi bi-person-heart"></i> Senior
            </button>
            <button type="button" class="btn btn-sm btn-outline-primary rounded-pill fw-bold" onclick="fillDemoLogin('family')">
              <i class="bi bi-people-fill"></i> Family
            </button>
            <button type="button" class="btn btn-sm btn-outline-info rounded-pill fw-bold" onclick="fillDemoLogin('doctor')">
              <i class="bi bi-prescription2"></i> Doctor
            </button>
            <button type="button" class="btn btn-sm btn-outline-dark rounded-pill fw-bold" onclick="fillDemoLogin('admin')">
              <i class="bi bi-shield-fill"></i> Admin
            </button>
          </div>
        </div>

        <form action="{{ url_for('login') }}" method="POST">
          <div class="mb-3">
            <label class="form-label fw-bold text-secondary small">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-0"><i class="bi bi-envelope-fill text-secondary"></i></span>
              <input type="email" id="login-email" name="email" class="form-control form-control-lg bg-light border-0" placeholder="name@example.com" required>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-bold text-secondary small">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-0"><i class="bi bi-lock-fill text-secondary"></i></span>
              <input type="password" id="login-password" name="password" class="form-control form-control-lg bg-light border-0" placeholder="Enter password" required>
            </div>
          </div>

          <button type="submit" class="btn-3d btn-3d-lime w-100 py-3 fs-5 mb-3">
            Sign In to Dashboard <i class="bi bi-arrow-right"></i>
          </button>

          <div class="text-center small text-secondary">
            Don't have an account yet? 
            <a href="{{ url_for('register') }}" class="fw-bold text-success text-decoration-none">Create an Account</a>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>
{% endblock %}
